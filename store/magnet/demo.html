<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magnet · CTA button · Kodehelix UI</title>
<link rel="stylesheet" href="magnet.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0}
  body{min-height:100vh;display:grid;place-items:center;background:#0b0d12;color:#c9cdd8;overflow-x:hidden;
    font:16px/1.5 "Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    background-image:radial-gradient(56vmax 40vmax at 50% 55%,rgba(59,91,255,.18),transparent 62%),
      radial-gradient(36vmax 26vmax at 64% 40%,rgba(34,195,238,.08),transparent 60%)}
  .wrap{position:relative;display:grid;justify-items:center;text-align:center;gap:clamp(10px,2.4vh,22px);padding:clamp(14px,5vh,48px) 16px;width:100%}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 10px;border-radius:999px;border:1px solid #262b3b;
    background:rgba(21,25,37,.7);color:#c9cdd8;font-size:13px;font-weight:500;letter-spacing:.01em}
  .eyebrow i{width:6px;height:6px;border-radius:50%;background:#22c3ee;box-shadow:0 0 0 3px rgba(34,195,238,.18)}
  h1{margin:0;color:#edeff5;font-size:clamp(26px,4.6vw,46px);line-height:1.08;letter-spacing:-.025em;font-weight:650;max-width:16ch}
  h1 span{background:linear-gradient(90deg,#8fa3ff,#22c3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
  .lede{margin:0;max-width:40ch;color:#8f95a6;font-size:clamp(14px,1.6vw,16px)}
  .zone{position:relative;display:grid;place-items:center;padding:clamp(10px,4vh,40px) 0}
  .field{position:absolute;inset:-10% -30%;pointer-events:none;opacity:.35;
    background:radial-gradient(closest-side,rgba(59,91,255,.32),rgba(34,195,238,.08) 55%,transparent)}
  .magnet{--magnet-size:clamp(16px,min(3.1vw,3.2vh),23px)}
  .hint{margin:0;font-size:13.5px;color:#8f95a6}
  .cursor{position:fixed;left:0;top:0;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;pointer-events:none;z-index:10;opacity:0;
    background:radial-gradient(circle,rgba(255,255,255,.95) 0 28%,rgba(255,255,255,.35) 32%,rgba(255,255,255,0) 70%);
    box-shadow:0 0 0 1.5px rgba(255,255,255,.5),0 0 22px rgba(143,163,255,.7)}
  .capture .hint{display:none}
</style>
</head>
<body>
  <main class="wrap">
    <span class="eyebrow"><i></i>Booking new projects for November</span>
    <h1>Websites people <span>can't help</span> clicking.</h1>
    <p class="lede">Bring your pointer close to the button and feel it pull.</p>
    <div class="zone">
      <span class="field" id="field" aria-hidden="true"></span>
      <button class="magnet" id="cta" data-magnet data-magnet-manual type="button">Start a project</button>
    </div>
    <p class="hint">Move your pointer near the button, then click it.</p>
  </main>
  <div class="cursor" id="cursor" aria-hidden="true"></div>
  <script src="magnet.js"></script>
  <script>
    if (/[?&]capture=1/.test(location.search)) document.documentElement.classList.add('capture');
    var field = document.getElementById('field'), cta = document.getElementById('cta');
    var m = Magnet.mount(cta, {
      strength: .38, radius: 120,
      onMove: function (s) { field.style.opacity = (.35 + .65 * s.pull).toFixed(3); }
    });

    // Auto-play for store previews: a soft cursor approaches, the button follows, click, drift away.
    var cur = document.getElementById('cursor'), demoRaf = 0;
    var K = [ // [time s, x and y in button widths/heights from centre]
      [0, 1.0, 2.0], [.75, .7, 1.0], [1.25, .3, .56], [1.6, .2, .52],
      [2.2, .0, .5], [2.8, -.5, 1.1], [3.5, -.9, 2.2]
    ];
    function cr(p0, p1, p2, p3, u) {
      return .5 * (2 * p1 + (p2 - p0) * u + (2 * p0 - 5 * p1 + 4 * p2 - p3) * u * u + (3 * p1 - p0 - 3 * p2 + p3) * u * u * u);
    }
    function at(t) {
      for (var i = 0; i < K.length - 1 && t > K[i + 1][0]; i++);
      var a = K[Math.max(0, i - 1)], b = K[i], c = K[Math.min(K.length - 1, i + 1)], d = K[Math.min(K.length - 1, i + 2)];
      var u = (t - b[0]) / ((c[0] - b[0]) || 1);
      return [cr(a[1], b[1], c[1], d[1], u), cr(a[2], b[2], c[2], d[2], u)];
    }
    function stopDemo(e) {
      if (!e.isTrusted || !demoRaf) return;
      cancelAnimationFrame(demoRaf); demoRaf = 0; cur.style.opacity = 0;
    }
    ['pointermove', 'pointerdown', 'keydown'].forEach(function (n) { addEventListener(n, stopDemo, true); });
    window.khDemo = function () {
      if (demoRaf) return;
      var start = performance.now(), lastCycle = -1, LOOP = 3.5, CLICK = 1.62;
      function frame(now) {
        var T = (now - start) / 1000, n = Math.floor(T / LOOP), t = T - n * LOOP;
        var c = m.center(), p = at(t), x = c.x + p[0] * c.w, y = c.y + p[1] * c.h;
        m.pointer(x, y);
        if (n !== lastCycle && t >= CLICK) { lastCycle = n; m.pulse(x, y); }
        var press = Math.max(0, 1 - Math.abs(t - CLICK) / .14);
        cur.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) scale(' + (1 - .32 * press).toFixed(3) + ')';
        cur.style.opacity = Math.min(1, t / .3, (LOOP - t) / .3).toFixed(3);
        demoRaf = requestAnimationFrame(frame);
      }
      demoRaf = requestAnimationFrame(frame);
    };
  </script>
</body>
</html>
