<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stack · toast notifications · Kodehelix UI</title>
<link rel="stylesheet" href="stack.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0}
  body{min-height:100vh;display:grid;place-items:center;padding:24px 16px clamp(24px,24vh,280px);background:#0b0d12;color:#c9cdd8;
    font:15px/1.5 "Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    background-image:radial-gradient(620px 440px at 30% 0%,rgba(59,91,255,.24),transparent 65%),radial-gradient(560px 420px at 100% 100%,rgba(34,195,238,.14),transparent 70%)}
  .wrap{display:grid;justify-items:center;gap:20px;width:100%}
  .panel{width:min(520px,100%);padding:clamp(20px,4vw,26px);border-radius:22px;background:#151925 linear-gradient(180deg,rgba(255,255,255,.03),transparent 120px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 0 0 1px #262b3b,0 30px 70px -30px rgba(0,0,0,.8)}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;margin:0 0 10px;color:#8fa3ff;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
  .eyebrow svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
  h1{margin:0;color:#edeff5;font-size:clamp(18px,3.4vw,21px);font-weight:650;letter-spacing:-.012em;line-height:1.3}
  .panel>p{margin:6px 0 18px;color:#8f95a6;font-size:14px}
  .fire{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .fire button{--t:#8fa3ff;display:flex;align-items:center;gap:9px;min-height:46px;padding:0 12px;border:0;border-radius:12px;cursor:pointer;
    color:#edeff5;font:600 14px/1 "Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    background:#1c2130;box-shadow:inset 0 0 0 1px #2a3043,inset 0 1px 0 rgba(255,255,255,.05);transition:background-color .15s,box-shadow .15s,transform .15s}
  .fire button:hover{background:#222839;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--t) 45%,#2a3043),inset 0 1px 0 rgba(255,255,255,.06)}
  .fire button:active{transform:scale(.97)}
  .fire button:focus-visible{outline:2px solid #8fa3ff;outline-offset:2px}
  .fire i{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:8px;color:var(--t);background:color-mix(in srgb,var(--t) 14%,transparent)}
  .fire svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
  .hint{margin:0;max-width:440px;text-align:center;color:#8f95a6;font-size:13.5px}
  .capture .hint{display:none}
  @media (max-width:560px){.fire{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:520px){body{padding-bottom:clamp(24px,30vh,320px)}}
  @media (max-height:640px) and (min-width:521px){body{align-items:start;padding-top:22px}.panel>p{display:none}.eyebrow{margin-bottom:6px}h1{margin-bottom:16px}.wrap{width:min(520px,100%);justify-items:start}.hint{text-align:left;max-width:250px}}
</style>
</head>
<body>
  <main class="wrap">
    <section class="panel" aria-labelledby="demo-title">
      <p class="eyebrow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5h4"/></svg>Notification center</p>
      <h1 id="demo-title">Send yourself a notification</h1>
      <p>Each one lands on the deck in the corner, newest in front.</p>
      <div class="fire">
        <button type="button" data-type="success" style="--t:#19c37d"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 12.5l3.5 3.5 7.5-8"/></svg></i>Success</button>
        <button type="button" data-type="info" style="--t:#8fa3ff"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 11v6M12 7v.01"/></svg></i>Info</button>
        <button type="button" data-type="warning" style="--t:#ffb020"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v7M12 17.5v.01"/></svg></i>Warning</button>
        <button type="button" data-type="error" style="--t:#ff5a6e"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8l8 8M16 8l-8 8"/></svg></i>Error</button>
      </div>
    </section>
    <p class="hint">Fire a few, then hover the stack to fan it out. Drag a toast to the right to dismiss it.</p>
  </main>

  <section data-stack aria-label="Notifications"></section>
  <script src="stack.js"></script>
  <script>
    if (/[?&]capture=1/.test(location.search)) document.documentElement.classList.add('capture');
    const copy = {
      success: [['Deployment live', 'kodehelix.in is now serving build #482.'], ['Payment received', '₹12,400 from Lumen Studio was added to your balance.']],
      info: [['New comment', 'Maya replied on Homepage v3: “Love the new hero.”'], ['Sync complete', '28 files are up to date across your devices.']],
      warning: [['Storage almost full', 'You’ve used 92% of your 50 GB plan.'], ['Card expires soon', 'Update your billing details before 30 Nov.']],
      error: [['Upload failed', 'brand-guide.pdf couldn’t be uploaded. Check your connection.'], ['Couldn’t save draft', 'The server didn’t respond. We’ll retry in 30 seconds.']]
    };
    const n = { success: 0, info: 0, warning: 0, error: 0 };
    function fire(type, duration) {
      const [title, body] = copy[type][n[type]++ % copy[type].length];
      return Stack.toast({ type, title, body, duration });
    }
    document.querySelectorAll('.fire button').forEach(b => b.addEventListener('click', () => fire(b.dataset.type)));

    // Auto-play for the store preview: build the deck, fan it out, swipe one away, loop every 5 s.
    window.khDemo = function () {
      const timers = [];
      let stopped = false;
      const at = (ms, fn) => timers.push(setTimeout(() => { if (!stopped) fn(); }, ms));
      const root = document.querySelector('[data-stack]');
      const hover = on => root.dispatchEvent(new PointerEvent(on ? 'pointerenter' : 'pointerleave', { pointerType: 'mouse' }));
      function swipe() {
        const lis = root.querySelectorAll('.stack__toast:not([aria-hidden])'), li = lis[lis.length - 2];
        if (!li) return;
        const r = li.getBoundingClientRect(), x0 = r.left + r.width * .35, y = r.top + r.height / 2;
        const ev = (type, x) => li.dispatchEvent(new PointerEvent(type, { bubbles: true, cancelable: true, clientX: x, clientY: y, pointerId: 9, pointerType: 'mouse', isPrimary: true, button: 0 }));
        ev('pointerdown', x0);
        for (let i = 1; i <= 10; i++) at(i * 20, () => ev('pointermove', x0 + i * i * 2.4));
        at(214, () => ev('pointerup', x0 + 240));
      }
      (function cycle() {
        timers.length = 0;
        ['success', 'info', 'warning', 'error'].forEach((t, i) => at(150 + i * 340, () => fire(t, 14000)));
        at(1750, () => hover(true));
        at(2850, swipe);
        at(3750, () => hover(false));
        at(4300, () => Stack.clear());
        at(5000, cycle);
      })();
      const stop = e => {
        if (!e.isTrusted) return;
        stopped = true; timers.forEach(clearTimeout);
        removeEventListener('pointerdown', stop, true); removeEventListener('keydown', stop, true);
      };
      addEventListener('pointerdown', stop, true); addEventListener('keydown', stop, true);
    };
  </script>
</body>
</html>
