<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comet · submit button · Kodehelix UI</title>
<link rel="stylesheet" href="comet.css">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;gap:28px;background:#0b0d12;color:#c9cdd8;font:16px/1.5 "Inter",system-ui,sans-serif;
    background-image:radial-gradient(700px 500px at 80% -10%,rgba(59,91,255,.35),transparent 60%)}
  .wrap{display:grid;justify-items:center;gap:22px;padding:24px;text-align:center}
  small{opacity:.7}
  @media (max-width:520px){.kh-t{display:none}}
</style>
</head>
<body>
<div style="position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-left,0px));background:rgba(11,13,18,.85);backdrop-filter:blur(10px);border-bottom:1px solid #262B3B;font:600 14px Inter,system-ui,sans-serif;z-index:9">
  <a href="/store/" style="color:#C9CDD8;text-decoration:none;white-space:nowrap">← Kodehelix UI</a>
  <span class="kh-t" style="color:#fff">Comet · submit button</span>
  <a href="https://wa.me/917007064653?text=Hi%20Kodehelix%2C%20I%27d%20like%20to%20buy%20the%20Comet%20submit%20button%20(%243)" target="_blank" rel="noopener" style="background:#3B5BFF;color:#fff;border-radius:999px;padding:9px 16px;text-decoration:none;white-space:nowrap">Buy · $3</a></div>

  <div class="wrap">
    <button class="comet" data-comet data-label="Submit" data-done="Sent"></button>
    <small>Click the button. The comet laps while it sends, then bursts into a check.</small>
  </div>
  <script src="comet.js"></script>
  <script>
    // Replace send() with your real request; the comet keeps looping until it resolves.
    Comet.mount(document.querySelector('[data-comet]'), {
      send: () => new Promise(r => setTimeout(r, 1800))
    });
  </script>
</body>
</html>
