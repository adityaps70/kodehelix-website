<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Helix · loader · Kodehelix UI</title>
<link rel="stylesheet" href="helix.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0}
  body{min-height:100vh;display:grid;place-items:center;background:#0b0d12;color:#c9cdd8;
    font:16px/1.5 "Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden;
    background-image:radial-gradient(60vmax 42vmax at 50% 38%,rgba(59,91,255,.20),transparent 62%),
      radial-gradient(40vmax 30vmax at 62% 70%,rgba(34,195,238,.10),transparent 60%)}
  .wrap{display:grid;justify-items:center;gap:clamp(14px,3vh,24px);padding:clamp(16px,4vh,40px) 16px;width:100%}
  .card{position:relative;width:min(480px,100%);display:grid;justify-items:center;gap:clamp(10px,2.2vh,18px);
    padding:clamp(20px,4.2vh,38px) clamp(18px,4vw,34px) clamp(20px,3.6vh,30px);border-radius:24px;
    background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,0) 40%),#121623;
    border:1px solid #232838;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 1px 2px rgba(0,0,0,.5),0 30px 80px -30px rgba(0,0,0,.8),0 40px 120px -40px rgba(59,91,255,.35)}
  .stage{appearance:none;border:0;background:none;padding:6px;margin:0;cursor:pointer;border-radius:18px;line-height:0;max-width:100%}
  .stage:focus-visible{outline:2px solid #8fa3ff;outline-offset:4px}
  .helix.big{width:clamp(200px,min(40vh,100vw - 110px),360px)}
  .status{display:grid;justify-items:center;gap:4px;text-align:center;min-height:46px}
  .status b{color:#edeff5;font-weight:600;font-size:17px;letter-spacing:-.005em}
  .status span{color:#8f95a6;font-size:13.5px;font-variant-numeric:tabular-nums}
  .rule{width:100%;height:1px;background:linear-gradient(90deg,transparent,#262b3b 20%,#262b3b 80%,transparent)}
  .hint{margin:0;font-size:13.5px;color:#8f95a6;text-align:center;max-width:44ch}
  .capture .hint{display:none}
</style>
</head>
<body>
  <main class="wrap">
    <div class="card">
      <button class="stage" type="button" id="stage" aria-label="Toggle the loader between loading and complete">
        <span class="helix big" id="big" data-helix data-helix-manual data-label="Syncing workspace" data-done="Workspace synced"></span>
      </button>
      <div class="status" aria-hidden="true">
        <b id="title">Syncing workspace</b>
        <span id="sub">Encrypting 2,481 files</span>
      </div>
      <div class="rule"></div>
      <button class="helix-btn" type="button" id="btn">
        <span class="helix-btn__icon"><span class="helix" id="mini" data-size="sm" data-label="Loading report" data-done="Report ready"></span></span>
        <span class="helix-btn__labels">
          <span class="is-on" data-state="idle">Fetch report</span>
          <span data-state="busy">Loading…</span>
          <span data-state="done">Report ready</span>
        </span>
      </button>
    </div>
    <p class="hint">Click the helix to complete it, click again to spin. Press the button for the inline loader.</p>
  </main>
  <script src="helix.js"></script>
  <script>
    if (/[?&]capture=1/.test(location.search)) document.documentElement.classList.add('capture');
    var big = Helix.mount(document.getElementById('big'), { dots: 16 });
    var mini = Helix.mount(document.getElementById('mini'), { size: 'sm' });
    var btn = document.getElementById('btn'), title = document.getElementById('title'), sub = document.getElementById('sub');
    var bigDone = false, btnTimers = [];

    function setBig(done) {
      bigDone = done;
      if (done) { big.done(); title.textContent = 'Workspace synced'; sub.textContent = '2,481 files · encrypted · just now'; }
      else { big.reset(); title.textContent = 'Syncing workspace'; sub.textContent = 'Encrypting 2,481 files'; }
    }
    document.getElementById('stage').addEventListener('click', function () { setBig(!bigDone); });

    var labelT = 0;
    function labels(s) {
      btn.querySelectorAll('[data-state]').forEach(function (l) { l.classList.toggle('is-on', l.dataset.state === s); });
      btn.classList.toggle('is-done', s === 'done');
    }
    function btnState(s) {
      clearTimeout(labelT);
      if (s === 'busy') mini.reset();
      if (s === 'done') {
        mini.done(); // keep aria-busy until the check starts drawing, then swap the label
        labelT = setTimeout(function () { btn.setAttribute('aria-busy', 'false'); labels('done'); }, 850);
      } else { btn.setAttribute('aria-busy', s === 'busy' ? 'true' : 'false'); labels(s); }
    }
    function clearBtn() { btnTimers.forEach(clearTimeout); btnTimers = []; }
    // Replace the timeout with your real request: btnState('busy'); await fetch(...); btnState('done');
    btn.addEventListener('click', function () {
      if (btn.getAttribute('aria-busy') === 'true') return;
      clearBtn(); btnState('busy');
      btnTimers.push(setTimeout(function () { btnState('done'); }, 1600));
      btnTimers.push(setTimeout(function () { btnState('idle'); }, 4200));
    });
    btnState('idle');

    // Auto-play for store previews: spinning -> done -> reset, every 4.4 s.
    var demoT = [], demoI = 0;
    function stopDemo(e) {
      if (!e.isTrusted || !demoI) return;
      clearInterval(demoI); demoI = 0; demoT.forEach(clearTimeout); demoT = [];
    }
    addEventListener('pointerdown', stopDemo, true); addEventListener('keydown', stopDemo, true);
    window.khDemo = function () {
      if (demoI) return;
      function at(ms, fn) { demoT.push(setTimeout(fn, ms)); }
      function cycle() {
        demoT.forEach(clearTimeout); demoT = [];
        clearBtn(); btnState('busy');
        at(600, function () { btnState('done'); });
        at(1900, function () { setBig(true); });
        at(3950, function () { setBig(false); btnState('idle'); });
      }
      cycle(); demoI = setInterval(cycle, 4400);
    };
  </script>
</body>
</html>
