<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dial · range slider · Kodehelix UI</title>
<link rel="stylesheet" href="dial.css">
<style>
  *{box-sizing:border-box}
  html{background:#0b0d12}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0d12;color:#c9cdd8;
    font:16px/1.5 "Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden;
    background-image:radial-gradient(60vmax 45vmax at 82% -10%,rgba(59,91,255,.30),transparent 62%),radial-gradient(50vmax 40vmax at 0% 110%,rgba(34,195,238,.16),transparent 60%)}
  .wrap{width:100%;display:grid;justify-items:center;gap:20px;padding:clamp(16px,4vw,32px) 16px}
  .card{width:min(560px,100%);padding:clamp(20px,4.6vw,30px) clamp(18px,4.6vw,30px) clamp(10px,2vw,16px);border-radius:24px;
    background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.01) 40%),#151925;
    box-shadow:inset 0 0 0 1px #262b3b,inset 0 1px 0 rgba(255,255,255,.06),0 40px 80px -40px rgba(0,0,0,.9),0 0 0 1px rgba(0,0,0,.3)}
  .bar{display:flex;align-items:center;justify-content:space-between;margin:0 0 22px;padding-bottom:16px;border-bottom:1px solid #262b3b}
  .bar b{display:inline-flex;align-items:center;gap:9px;color:#edeff5;font-size:15px;font-weight:650}
  .bar svg{width:18px;height:18px;fill:none;stroke:#8fa3ff;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
  .reset{border:0;border-radius:10px;padding:6px 10px;background:transparent;color:#8f95a6;font:600 13px/1 "Inter",ui-sans-serif,system-ui,sans-serif;cursor:pointer}
  .reset:hover{color:#edeff5;background:rgba(255,255,255,.05)}
  .reset:focus-visible{outline:2px solid #8fa3ff;outline-offset:2px}
  .hint{margin:0;max-width:520px;text-align:center;color:#8f95a6;font-size:13.5px}
  .capture .hint{display:none}
  @media (max-height:540px){.wrap{padding:10px 16px;gap:10px}.bar{margin-bottom:14px;padding-bottom:12px}.card{padding-top:18px}}
</style>
</head>
<body>
  <main class="wrap">
    <section class="card" aria-label="Filters">
      <div class="bar">
        <b><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>Filters</b>
        <button class="reset" type="button">Reset</button>
      </div>
      <div data-dial data-min="0" data-max="10000" data-step="100" data-from="1200" data-to="8500" data-currency="₹"></div>
    </section>
    <p class="hint">Drag either handle and watch the tags swing. Or focus a handle and use the arrow keys.</p>
  </main>
  <script src="dial.js"></script>
  <script>
    if (/[?&]capture=1/.test(location.search)) document.documentElement.classList.add('capture');
    const host = document.querySelector('[data-dial]');
    document.querySelector('.reset').addEventListener('click', () => Dial.mount(host).set(1200, 8500));

    // Auto-play: glides one handle at a time so the tags swing, every ~1.75 s.
    // Stops for good the moment a real person touches or types.
    window.khDemo = function () {
      const d = Dial.mount(host), timers = [];
      let off = false, n = 0;
      const moves = [[null, 4800], [3000, null], [null, 9200], [600, null], [null, 6400], [2200, null], [null, 8500], [1200, null]];
      const stop = e => { if (e.isTrusted && !off) { off = true; timers.forEach(clearTimeout); } };
      ['pointerdown', 'keydown'].forEach(t => addEventListener(t, stop, true));
      function next() {
        if (off) return;
        const [a, b] = moves[n++ % moves.length];
        d.set(a, b, { duration: 820, grab: true });
        timers.push(setTimeout(next, 1750));
      }
      timers.push(setTimeout(next, 300));
    };
  </script>
</body>
</html>
