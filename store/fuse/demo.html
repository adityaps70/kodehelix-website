<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fuse · burn-through to-do checklist · Kodehelix UI</title>
<link rel="stylesheet" href="fuse.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0}
  body{min-height:100vh;display:grid;place-items:center;background:#0b0d12;color:#c9cdd8;
    font:16px/1.5 "Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden;
    background-image:radial-gradient(60vmax 40vmax at 72% 16%,rgba(59,91,255,.22),transparent 62%),
      radial-gradient(40vmax 30vmax at 22% 84%,rgba(34,195,238,.10),transparent 60%)}
  .wrap{display:grid;justify-items:center;gap:clamp(14px,2.6vh,22px);padding:clamp(18px,4vh,40px) 16px;width:100%;max-width:520px;min-width:0}
  .wrap > .fuse{box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 1px 2px rgba(0,0,0,.5),0 40px 100px -40px rgba(59,91,255,.5),0 30px 70px -34px rgba(0,0,0,.9)}
  .hint{margin:0;font-size:13.5px;color:#8f95a6;text-align:center;max-width:44ch}
  .capture .hint{display:none}
</style>
</head>
<body>
  <main class="wrap">
    <ul id="todo" data-fuse data-fuse-manual data-title="Launch checklist" data-subtitle="Orbitly 2.4 · ships Friday">
      <li data-done data-tag="Mon">Freeze the release branch</li>
      <li data-tag="Today" data-tone="warning">Run the smoke tests</li>
      <li data-tag="Today" data-tone="warning">Write the changelog</li>
      <li data-tag="Wed">Record the demo video</li>
      <li data-tag="Thu" data-tone="cyan">Email the beta testers</li>
      <li data-tag="Fri" data-tone="danger">Ship to production</li>
    </ul>
    <p class="hint">Tick a task and it burns through like a fuse, then sinks to the bottom. Finish them all for a finale.</p>
  </main>
  <script src="fuse.js"></script>
  <script>
    if (/[?&]capture=1/.test(location.search)) document.documentElement.classList.add('capture');
    var todo = Fuse.mount(document.getElementById('todo'));

    // Auto-play for store previews: tick tasks one after another, celebrate, then reset and repeat.
    var demoT = [], demoI = 0;
    function stopDemo(e) {
      if (!e.isTrusted || !demoI) return;
      clearInterval(demoI); demoI = 0; demoT.forEach(clearTimeout); demoT = [];
    }
    addEventListener('pointerdown', stopDemo, true); addEventListener('keydown', stopDemo, true);
    window.khDemo = function () {
      if (demoI) return;
      function cycle() {
        demoT.forEach(clearTimeout); demoT = [];
        [300, 1900, 3500, 5100, 6700].forEach(function (t) { demoT.push(setTimeout(function () { todo.next(); }, t)); });
        demoT.push(setTimeout(function () { todo.reset(); setTimeout(function () { todo.check(0); }, 500); }, 9600));
      }
      cycle(); demoI = setInterval(cycle, 10800);
    };
  </script>
</body>
</html>
