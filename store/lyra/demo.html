<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,follow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lyra · constellation star rating · Kodehelix UI</title>
<link rel="stylesheet" href="lyra.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0}
  body{min-height:100vh;display:grid;place-items:center;background:#0b0d12;color:#c9cdd8;
    font:16px/1.5 "Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden;
    background-image:radial-gradient(60vmax 40vmax at 70% 18%,rgba(59,91,255,.22),transparent 62%),
      radial-gradient(40vmax 30vmax at 25% 82%,rgba(34,195,238,.10),transparent 60%)}
  .wrap{display:grid;justify-items:center;gap:clamp(14px,2.6vh,22px);padding:clamp(18px,4vh,40px) 16px;width:100%;max-width:520px;min-width:0}
  .wrap > .lyra{box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 1px 2px rgba(0,0,0,.5),0 40px 100px -40px rgba(59,91,255,.5),0 30px 70px -34px rgba(0,0,0,.9)}
  .hint{margin:0;font-size:13.5px;color:#8f95a6;text-align:center;max-width:44ch}
  .capture .hint{display:none}
</style>
</head>
<body>
  <main class="wrap">
    <div id="rate" data-lyra data-lyra-manual data-title="How was your delivery?" data-subtitle="Tap a star. We read every rating." data-name="rating"></div>
    <p class="hint">Pick a rating and watch the stars join up into a constellation. Arrow keys work too.</p>
  </main>
  <script src="lyra.js"></script>
  <script>
    if (/[?&]capture=1/.test(location.search)) document.documentElement.classList.add('capture');
    var rate = Lyra.mount(document.getElementById('rate'));

    // Auto-play for store previews: rate 5, then 2, then start over (every 5 s).
    var demoT = [], demoI = 0;
    function stopDemo(e) {
      if (!e.isTrusted || !demoI) return;
      clearInterval(demoI); demoI = 0; demoT.forEach(clearTimeout); demoT = [];
    }
    addEventListener('pointerdown', stopDemo, true); addEventListener('keydown', stopDemo, true);
    window.khDemo = function () {
      if (demoI) return;
      function cycle() {
        demoT.forEach(clearTimeout); demoT = [];
        demoT.push(setTimeout(function () { rate.set(5); }, 300));
        demoT.push(setTimeout(function () { rate.set(2); }, 2900));
        demoT.push(setTimeout(function () { rate.reset(); }, 4500));
      }
      cycle(); demoI = setInterval(cycle, 5000);
    };
  </script>
</body>
</html>
