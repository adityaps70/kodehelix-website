<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Volt · power-up settings switches · Kodehelix UI</title>
<link rel="stylesheet" href="volt.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0}
  body{min-height:100vh;display:grid;place-items:center;background:#0b0d12;color:#c9cdd8;overflow-x:hidden;
    font:16px/1.5 "Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    background-image:radial-gradient(56vmax 40vmax at 50% 20%,rgba(59,91,255,.22),transparent 62%),
      radial-gradient(40vmax 30vmax at 85% 95%,rgba(34,195,238,.10),transparent 60%)}
  .wrap{width:100%;max-width:472px;min-width:0;padding:clamp(20px,5vh,56px) 16px 28px;display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;gap:18px}
  .hint{margin:0;font-size:13.5px;color:#8f95a6;text-align:center;max-width:44ch}
  .capture .hint{display:none}
</style>
</head>
<body>
  <main class="wrap">
    <div id="settings" data-volt data-volt-manual></div>
    <p class="hint">Flip a switch: the current runs along the trace and powers up its feature. Flip <b>All</b> to send it down the bus and switch everything on in one go.</p>
  </main>
  <script src="volt.js"></script>
  <script>
    if (/[?&]capture=1/.test(location.search)) document.documentElement.classList.add('capture');
    var volt = Volt.mount(document.getElementById('settings'), {
      title: 'Workspace settings',
      items: [
        { id: 'alerts', label: 'Push notifications', desc: 'Mentions and replies', icon: 'bell', tint: '#8FA3FF', on: true },
        { id: 'backup', label: 'Auto backup', desc: 'Every night at 2:00', icon: 'cloud', tint: '#22C3EE' },
        { id: 'location', label: 'Location sharing', desc: 'Only while using the app', icon: 'pin', tint: '#FFB020' },
        { id: 'twofa', label: 'Two-step sign-in', desc: 'Code on new devices', icon: 'shield', tint: '#19C37D', on: true },
        { id: 'wifi', label: 'Sync on Wi-Fi only', desc: 'Saves mobile data', icon: 'wifi', tint: '#3B5BFF' }
      ],
      onChange: function (id, on) { console.log(id, on ? 'on' : 'off'); }
    });

    // Auto-play for store previews: one switch, then All on, All off, reset. Stops on real input.
    var demoT = [], demoI = 0;
    function stopDemo(e) {
      if (!e.isTrusted || (!demoI && !demoT.length)) return;
      clearInterval(demoI); demoT.forEach(clearTimeout); demoT = []; demoI = 0;
    }
    addEventListener('pointerdown', stopDemo, true); addEventListener('keydown', stopDemo, true);
    window.khDemo = function () {
      if (demoI || demoT.length) return;
      function at(ms, fn) { demoT.push(setTimeout(fn, ms)); }
      function cycle() {
        demoT = [];
        at(150, function () { volt.set('backup', true); });
        at(1000, function () { volt.all(true); });
        at(3700, function () { volt.all(false); });
        at(4500, function () { volt.set('alerts', true); });
        at(4750, function () { volt.set('twofa', true); });
      }
      cycle(); demoI = setInterval(cycle, 5600);
    };
  </script>
</body>
</html>
